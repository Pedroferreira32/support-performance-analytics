services:
  - type: web
    name: support-performance-data-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-performance-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://support-performance-analytics.vercel.app,http://localhost:5173

databases:
  - name: support-performance-db
    databaseName: support_performance
    user: support_performance
    plan: free
